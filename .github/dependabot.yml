version: 2
updates:
  # All Maven dependency + plugin updates collapse into a SINGLE grouped PR
  # (instead of one PR per dependency). Patch/minor bundles auto-merge once CI
  # is green; a bundle that contains any major bump is held for manual review
  # (see .github/workflows/dependabot-auto-merge.yml).
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      maven-all:
        patterns:
          - "*"
    ignore:
      # The NiFi parent POM is intentionally pinned to 2.1.0. Bumping it to a
      # newer NiFi (e.g. 2.9.0) drags in a parent that bans JUnit 4 and requires
      # a full JUnit 4->5 test migration (see PR #107). The build already targets
      # NiFi via the nifi.version property, so the parent bump is deferred. Allow
      # patch updates (2.1.x); block minor/major until we migrate to JUnit 5.
      - dependency-name: "org.apache.nifi:nifi-extension-bundles"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # All GitHub Actions updates collapse into a SINGLE grouped PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    groups:
      github-actions-all:
        patterns:
          - "*"

  # Base image updates for the published container. Dependabot reads the literal
  # tag in the Dockerfile's FROM line, which is why that tag is pinned literally
  # rather than templated from the `nifi.version` Maven property - a property
  # reference here would be invisible to Dependabot and the pin would go stale
  # again (it had drifted to 2.1.0 while the bundle targeted 2.10.0).
  - package-ecosystem: docker
    directory: "/docker-image/src/main/docker/nifi"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      docker-all:
        patterns:
          - "*"
