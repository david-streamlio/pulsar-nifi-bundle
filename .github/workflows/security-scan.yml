name: Security Scan

# Weekly vulnerability scan of both surfaces Dependabot cannot fully see:
#
#   1. the Maven dependency tree, including transitives Dependabot only reports
#      on when an advisory names the direct dependency, and
#   2. the built container image, whose base (apache/nifi) carries a full JRE and
#      OS userland that no Maven scan will ever look at.
#
# Runs on a schedule rather than on push: the point is that this happens on a
# cadence rather than when someone remembers to look. Results go to the Security
# tab as SARIF, so findings accumulate somewhere reviewable instead of scrolling
# past in a log.
#
# Both jobs fail on HIGH and CRITICAL findings that have a fix. Accepted findings
# belong in .trivyignore.yaml with a statement, a review date and, where the finding
# is tied to specific files, their paths - not suppressed silently here. Every scan
# step below reads that file through `trivyignores`.
on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Least privilege: read the code, write scan results to the Security tab.
permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Trivy resolves a module's dependency on a sibling module (nifi-pulsar-processors ->
      # nifi-pulsar-client-service-api, say) by its coordinates, not from this checkout. main's version
      # is 0.0.0-SNAPSHOT, which is never published (see VERSIONING.md), so no remote repository has
      # those poms, and without this step the scan skips everything a module reaches through a
      # sibling. Installing first puts this checkout's poms, and every pom they depend on, in ~/.m2,
      # which Trivy reads before going remote.
      # That also keeps the scan off Maven Central, whose rate limiting (HTTP 429) otherwise leaves
      # parts of the tree unresolved and silently unscanned.
      - name: Install this checkout's poms for Trivy to resolve
        run: ./mvnw -B -ntp install -DskipTests -Dgpg.skip=true -pl '!docker-image'

      # Two passes over the same cached database. The first records everything
      # for the Security tab; the second decides whether the run goes red. They
      # are split because the SARIF must upload even when the gate fails.
      #
      # target/ is skipped: after the install it holds built jars, and this job scans the dependency
      # tree as declared. What ships in the image is the image job's concern.
      - name: Scan dependency tree (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: '**/target'
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-deps.sarif
          exit-code: '0'

      - name: Upload dependency findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

      # Fails the run on CVSS >= 7 equivalents, per issue #197.
      - name: Fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: '**/target'
          trivyignores: .trivyignore.yaml
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Full build including the docker-image module: the fabric8 plugin produces
      # the local image `streamnative/nifi:latest` during the package phase. This
      # is the same image the release workflow pushes to GHCR.
      - name: Build image
        run: ./mvnw -B -ntp clean package -Dgpg.skip=true -DskipTests

      # Same two passes as the dependency job: everything to the Security tab, then
      # the gate.
      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: streamnative/nifi:latest
          scanners: vuln
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Upload image findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # The image carries NiFi's whole runtime - a Debian userland, a JRE and
      # NiFi's own jars - so it reports a long tail of upstream CVEs. The gate
      # stays meaningful because of how that tail splits:
      #   - Debian packages with a fix are installed by the Dockerfile's upgrade
      #     step, so they never reach this gate.
      #   - Findings with no fix yet (Debian's "affected", "fix_deferred",
      #     "will_not_fix") are skipped by ignore-unfixed: nothing can act on them.
      #   - What is left is fixable and either ours to fix or a decision to record
      #     in .trivyignore.yaml - NiFi's own jars, say, which only a NiFi release
      #     can update.
      - name: Fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: streamnative/nifi:latest
          scanners: vuln
          trivyignores: .trivyignore.yaml
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
