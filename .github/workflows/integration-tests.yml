name: Integration Tests

# Runs the Testcontainers-backed integration tests (*IT.java) against real Pulsar brokers - one per
# supported broker line - on every pull request and every push to main.
#
# These are deliberately a separate workflow from CI: they need a Docker daemon and take
# appreciably longer than the unit tests, so keeping them apart preserves the fast
# "Build & Test (Java 21)" signal while still gating merges on real-broker behaviour.
#
# Like CI this uses `pull_request` (never `pull_request_target`), so fork PRs run with a
# read-only token and no access to repository secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: it-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker:
    # The same suite against each broker line we support. The bundle ships one Pulsar client
    # (pulsar.version), but users run it against older brokers too, and a client/broker mismatch only
    # shows up against a real broker of that version.
    name: Integration Tests (${{ matrix.broker }} broker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every broker finish: telling a client bug from a broker-version incompatibility needs both
      # results, and a red leg would otherwise cancel the green one.
      fail-fast: false
      matrix:
        include:
          # The broker matching the client: no override, so it follows the pom's pulsar.image, which
          # is kept in step with pulsar.version.
          - broker: Pulsar 5
            id: pulsar-5
            image: ''
          # The previous major's LTS line, which is what Pulsar 4 deployments run. Named explicitly
          # rather than through a Maven profile: a mistyped -P only warns, and the leg would then pass
          # against the Pulsar 5 broker without anyone noticing.
          - broker: Pulsar 4 LTS
            id: pulsar-4-lts
            image: apachepulsar/pulsar:4.0.14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest ships a running Docker daemon; fail loudly and early if that changes,
      # rather than surfacing as a confusing Testcontainers "could not find a valid Docker
      # environment" error midway through the build.
      - name: Verify Docker is available
        run: |
          docker version
          echo "Server minimum API version: $(docker version --format '{{.Server.MinAPIVersion}}')"

      # Pre-pulling makes the first container start predictable and keeps the pull time out
      # of the per-test startup timeout.
      # Pulling ahead of time keeps the image download out of the per-test startup timeout. It is an
      # optimisation, not a requirement - Testcontainers pulls the image itself if this does not - so a
      # failure here must not fail the build.
      #
      # -q -DforceStdout does not guarantee that only the property value reaches stdout: a Maven warning
      # (a cached dependency-resolution failure, say) lands there too and gets fed to `docker pull`, which
      # then fails with "invalid reference format". Take the last line and check it looks like an image.
      - name: Pre-pull the Pulsar image
        continue-on-error: true
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
        run: |
          IMAGE="$MATRIX_IMAGE"
          if [ -z "$IMAGE" ]; then
            IMAGE="$(./mvnw -B -ntp help:evaluate -Dexpression=pulsar.image -q -DforceStdout 2>/dev/null | tail -n 1 | tr -d '[:space:]')"
          fi
          echo "Resolved Pulsar image: '$IMAGE'"

          if [ -z "$IMAGE" ] || printf '%s' "$IMAGE" | grep -qv '^[a-z0-9._/-]\+:[A-Za-z0-9._-]\+$'; then
            echo "Could not resolve a usable image reference; leaving the pull to Testcontainers."
            exit 0
          fi

          docker pull "$IMAGE"

      # `verify` is what runs Failsafe; `package` (used by the CI workflow) stops short of it.
      - name: Run integration tests
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
        run: ./mvnw -B -ntp verify -Dgpg.skip=true -pl nifi-pulsar-processors -am ${MATRIX_IMAGE:+"-Dpulsar.image=$MATRIX_IMAGE"}

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports-${{ matrix.id }}
          path: '**/target/failsafe-reports/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  integration-test:
    # This name is referenced by branch protection as a required check - keep it stable. It stands in
    # for the broker matrix, whose job names carry the broker and so cannot be required one by one.
    name: Integration Tests (Java 21)
    needs: broker
    # Must run when the matrix fails: a required check that is skipped counts as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every broker to pass
        env:
          RESULT: ${{ needs.broker.result }}
        run: |
          echo "Broker matrix: $RESULT"
          test "$RESULT" = success
