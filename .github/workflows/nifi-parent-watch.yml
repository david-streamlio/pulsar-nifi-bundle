name: NiFi Parent Watch

# Reports what the NiFi parent POM is holding back (#206).
#
# Written while the parent org.apache.nifi:nifi-extension-bundles was pinned at 2.1.0 and
# Dependabot ignored it, because a newer parent banned JUnit 4 (#107). That pin is gone (#248):
# the tests are on JUnit 5, Dependabot proposes parent updates again, and CI fails when the
# parent and nifi.version differ. The report stays useful as a running view of how far the
# parent trails the latest NiFi release and which advisories that leaves unfixed.
#
# This is a report, never a gate. It maintains ONE issue rather than opening a new one each
# week, so the history is a single thread rather than a pile nobody reads.
on:
  schedule:
    # Mondays at 09:00 UTC, after the security scan.
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Least privilege: read the pom, write the tracking issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: nifi-parent-watch
  cancel-in-progress: false

jobs:
  report:
    name: Report what the pin holds back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No Java or Maven needed: the script reads the POM chain from Maven Central directly,
      # which is faster than resolving an effective POM and needs no toolchain.
      - name: Build the report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/nifi_parent_watch.py | tee report.md

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "NiFi parent pin: what it is currently holding back"
        run: |
          set -euo pipefail

          # Nothing to say when the pin is current: do not open an issue to report good news.
          if grep -q "Nothing to report" report.md; then
            echo "Parent is up to date; no issue needed."
            exit 0
          fi

          {
            echo "_Generated by [NiFi Parent Watch](../actions/workflows/nifi-parent-watch.yml)"
            echo "on $(date -u '+%Y-%m-%d'). Updated in place each run - see the edit history for"
            echo "how this has moved. Tracked by #206._"
            echo
            cat report.md
          } > body.md

          existing="$(gh issue list --state open --search "$TITLE in:title" \
                        --json number,title \
                        --jq "[.[] | select(.title == env.TITLE)][0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Updated #$existing"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
